// react-native-ops-scanner — Android library module.
//
// Old-bridge ReactContextBaseJavaModule (no codegen, no TurboModule spec);
// the New Architecture interop layer loads it unchanged. The host app's
// autolinking picks up CodeScannerPackage from src/main/java.

buildscript {
    ext.getExtOrDefault = { name, defaultValue ->
        rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:${getExtOrDefault('AGP', '8.7.2')}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion', '2.1.20')}"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'live.citymall.opsscanner'
    compileSdk getExtOrDefault('compileSdkVersion', 36)

    defaultConfig {
        minSdk getExtOrDefault('minSdkVersion', 24)
        targetSdk getExtOrDefault('targetSdkVersion', 36)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        // CodeScannerActivity inflates res/layout/activity_ops_scanner.xml
        // through ActivityOpsScannerBinding.
        viewBinding true
        buildConfig false
    }

    lint {
        // tl-app ships minSdk 24; NewApi is the only guard against a call
        // needing a newer API sneaking in.
        abortOnError true
        fatal 'NewApi'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-android"

    // Screen: AppCompatActivity, insets, back handling.
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-ktx:1.9.3"
    // Root of res/layout/activity_ops_scanner.xml.
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    // Camera. The host sets `ext.cameraxVersion` in android/build.gradle so
    // this library and react-native-face-capture resolve to one tested CameraX;
    // Gradle would otherwise silently pick the highest version any module asks
    // for. camera-mlkit-vision maps ML Kit boxes into PreviewView coordinates
    // for the frame-only filter and must match the other camera-* artifacts.
    def cameraxVersion = getExtOrDefault('cameraxVersion', '1.4.2')
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation "androidx.camera:camera-mlkit-vision:$cameraxVersion"

    // ML Kit barcode model, BUNDLED on purpose: a fresh install or stale Play
    // Services must still scan a rack on the first try.
    implementation "com.google.mlkit:barcode-scanning:${getExtOrDefault('mlkitBarcodeScanningVersion', '17.3.0')}"
}
